<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Elephant Dance — Week 4 Lesson 1</title><style>
:root{--ink:#30365c;--cream:#fff9ec;--gold:#ffcb55;--pink:#ffd5e5;--green:#c7f4d0;--blue:#d5edff;--burg:#7a2747}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#d9edff,#fef7db 65%,#d9f6dc);font-family:'Trebuchet MS',Arial,sans-serif;color:var(--ink);display:flex;flex-direction:column}header,footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;flex-wrap:wrap}h1{font-size:clamp(21px,3vw,36px);margin:0;color:var(--burg)}h2{font-size:clamp(25px,4vw,48px);margin:0 0 16px;text-align:center;color:var(--burg)}main{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 18px}.stage{width:min(1100px,100%);text-align:center}.row{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{background:white;border:3px solid var(--ink);border-radius:24px;padding:20px;box-shadow:0 6px 0 #30365c;min-width:0}.btn{background:var(--gold);border:3px solid var(--ink);border-radius:18px;padding:12px 18px;min-height:55px;font-size:clamp(17px,2.3vw,26px);font-weight:800;color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.btn:focus-visible{outline:4px solid #2386dd}.btn:disabled{opacity:.5;cursor:default}.choice{background:#fff;min-height:160px;width:100%}.emoji{display:block;font-size:clamp(56px,8vw,100px);line-height:1.25}.big{font-size:clamp(25px,3.8vw,46px);font-weight:800}.medium{font-size:clamp(19px,2.8vw,30px)}.small{font-size:16px}.pill{background:white;border:2px solid var(--ink);border-radius:50px;padding:9px 13px;font-weight:800;font-size:20px}.ok{background:var(--green)!important}.bad{animation:shake .3s}.glow{outline:5px solid #ff9b31}.bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}.dot{border:2px solid var(--ink);background:white;border-radius:50%;width:46px;height:46px;font-size:22px;cursor:pointer}.dot.active{background:var(--gold)}.dot.done{background:var(--green)}#feedback{min-height:48px;margin-top:14px}.teacher{position:fixed;z-index:5;right:15px;top:80px;width:min(400px,90vw);background:white;border:3px solid var(--ink);border-radius:20px;padding:20px;box-shadow:0 12px 35px #0004}.teacher[hidden]{display:none}.teacher p{line-height:1.5}.teacher input{font-size:24px;width:75px;padding:5px}.spark{position:fixed;pointer-events:none;font-size:32px;animation:fly 1s forwards;z-index:10}@keyframes fly{to{transform:translateY(-140px) rotate(40deg);opacity:0}}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:10px}.choice{min-height:125px}.btn{padding:8px 10px}header{padding:8px}main{padding:8px}}
</style></head><body><header><h1>🐘 The Elephant Dance <span class="small">· Week 4 · Lesson 1</span></h1><div class="row"><span class="pill">⭐ <span id="stars">0</span></span><button class="btn" id="teamA">🦁 <span>0</span></button><button class="btn" id="teamB">🐘 <span>0</span></button><button class="btn" id="sound">🔊</button><button class="btn" id="teacher">🧑‍🏫</button></div></header><main><div class="stage" id="stage"></div></main><footer><button class="btn" id="back">◀ Back</button><div class="bar" id="dots"></div><button class="btn" id="next">Next ▶</button></footer><aside class="teacher" id="panel" hidden><h3>Teacher Panel</h3><p id="teacherTip"></p><div class="row">Pick student 1–<input id="count" type="number" min="2" max="60" value="20"><button class="btn" id="pick">🎲 Pick</button><strong id="picked"></strong></div><hr><div class="row"><button class="btn" id="reset">Reset scores</button><button class="btn" id="full">⛶ Full screen</button></div><p>Tap 🦁 or 🐘 to award a team point. ⭐ counts completed tasks. Use Back/Next to switch stages.</p></aside><script>
const $=s=>document.querySelector(s),stage=$('#stage');let current=0,stars=0,teams=[0,0],muted=false,finished=new Set(),audio=window.speechSynthesis;function speak(s){if(muted||!audio)return;audio.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.78;u.pitch=1.08;audio.speak(u)}function reward(e,n=1){stars+=n;$('#stars').textContent=stars;if(e){let p=document.createElement('span');p.className='spark';p.textContent='⭐';p.style.left=(e.clientX||innerWidth/2)+'px';p.style.top=(e.clientY||innerHeight/2)+'px';document.body.append(p);setTimeout(()=>p.remove(),1000)}}function correct(e,message){reward(e);$('#feedback').textContent='🌟 '+message;speak('Great job! '+message)}function wrong(e){e.currentTarget.classList.add('bad');setTimeout(()=>e.currentTarget.classList.remove('bad'),350);$('#feedback').textContent='Try again!';speak('Try again!')}function finish(e){if(!finished.has(current)){finished.add(current);reward(e,3)}$('#feedback').textContent='🎉 Stage complete! Click Next!';drawNav()};function buttons(items,fn){return `<div class="grid">${items.map((x,i)=>`<button class="btn card choice" data-i="${i}"><span class="emoji">${x[0]}</span><span class="medium">${x[1]}</span></button>`).join('')}</div>`}function attach(fn){stage.querySelectorAll('[data-i]').forEach(b=>b.onclick=e=>fn(+b.dataset.i,e))}
const warm=[['🎨','draw'],['🏃','run'],['🎤','sing'],['💃','dance']];function warmup(){let seen=new Set;stage.innerHTML=`<h2>What are you good at? 🌟</h2><p class="medium">Tap a picture. Say: “I can …” Then act it out!</p>${buttons(warm)}<p id="feedback" class="big"></p>`;attach((i,e)=>{speak('I can '+warm[i][1]);e.currentTarget.classList.add('ok');if(!seen.has(i)){seen.add(i);reward(e)}$('#feedback').textContent='🗣️ I can '+warm[i][1]+'!';if(seen.size===warm.length)finish(e)})}
const vocab=[['🌟','talent','Something you can do well.','Show a skill you can do well!'],['🧗','climb','Go up something.','Pretend to climb a tree!'],['😂','joke','Something funny we say.','Make a happy laughing face!'],['💃','dance','Move to music.','Do a little dance!'],['💦','spray','Send out drops of water.','Pretend your arm is a trunk!'],['🐘','trunk','An elephant’s long nose.','Stretch your arm like a trunk!'],['😟','worry','Feel afraid something may go wrong.','Show a worried face!'],['🎉','prance','Move with lively high steps.','Take two high steps!']];function wizard(){let i=0,seen=new Set;function render(){let v=vocab[i];stage.innerHTML=`<h2>Vocabulary Wizard 🪄</h2><p class="medium">👂 Listen → 🗣️ Say → 🎭 Act</p><div class="card" style="max-width:650px;margin:auto;background:var(--cream)"><div class="emoji" style="font-size:120px">${v[0]}</div><div class="big">${v[1]}</div><p class="medium">${v[2]}</p><p class="medium" id="act">Tap Play to listen!</p></div><div class="row" style="margin-top:20px"><button class="btn" id="prevword">◀ Word</button><button class="btn" id="play">🔊 Play & Act</button><button class="btn" id="nextword">Word ▶</button></div><p class="medium">${vocab.map((_,j)=>seen.has(j)?'⭐':'○').join(' ')}</p><p id="feedback"></p>`;$('#prevword').onclick=()=>{i=(i+vocab.length-1)%vocab.length;render()};$('#nextword').onclick=()=>{i=(i+1)%vocab.length;render()};$('#play').onclick=e=>{speak(v[1]+'. '+v[2]+'. '+v[3]);$('#act').textContent='🎭 '+v[3];if(!seen.has(i)){seen.add(i);reward(e)}if(seen.size===vocab.length)finish(e)}}render()}
const animals=[['🦁','Lion','climb a tree'],['🦜','Parrot','tell jokes'],['🐒','Monkey','dance'],['🐘','Elephant','spray water']];function detective(){let phase=0,seen=new Set,qi=0;const qs=[['Who can climb a tree?',0],['Who can tell jokes?',1],['Who can dance?',2],['Who can spray water?',3]];function render(){stage.innerHTML=`<h2>Animal Talent Detective 🔎</h2><p class="medium" id="question">${phase?qs[qi][0]:'Tap each animal. Listen and repeat!'}</p>${buttons(animals.map(a=>[a[0],a[1]]))}<div class="row" style="margin-top:15px"><button class="btn" id="start" ${phase||seen.size<4?'disabled':''}>🎯 Start Challenge</button><button class="btn" id="repeat">🔊 Repeat Question</button></div><p id="feedback" class="big"></p>`;attach((i,e)=>{if(!phase){speak(animals[i][1]+' can '+animals[i][2]);e.currentTarget.classList.add('ok');if(!seen.has(i)){seen.add(i);reward(e)}$('#feedback').textContent=animals[i][1]+' can '+animals[i][2]+'.';if(seen.size===4)$('#start').disabled=false}else if(i===qs[qi][1]){correct(e,animals[i][1]+' can '+animals[i][2]+'.');qi++;if(qi===qs.length){finish(e);phase=2}else setTimeout(()=>{render();speak(qs[qi][0])},950)}else wrong(e)});$('#start').onclick=()=>{phase=1;render();speak(qs[0][0])};$('#repeat').onclick=()=>speak(phase===1?qs[qi][0]:'Tap each animal. Listen and repeat.')};render()}
const details=[['Who can climb a tree?',[['🦁','Lion'],['🦜','Parrot'],['🐘','Elephant']],0],['Who tells jokes?',[['🐒','Monkey'],['🦜','Parrot'],['🦁','Lion']],1],['Who dances?',[['🐘','Elephant'],['🦁','Lion'],['🐒','Monkey']],2],['How does Elephant feel when she cannot find a talent?',[['😊','Happy'],['😟','Worried'],['😴','Sleepy']],1],['What does Elephant spray?',[['🍃','Leaves'],['🏖️','Sand'],['💦','Water']],2],['What do her friends do at the end?',[['👏','Clap and thank her'],['🏃','Run away'],['😴','Go to sleep']],0]];function story(){let completed=new Set,active=-1;function render(){stage.innerHTML=`<h2>Key Details & Retelling 📖</h2><p class="medium">Choose a number, listen, and answer!</p><div class="row">${details.map((q,i)=>`<button class="btn ${completed.has(i)?'ok':''}" data-q="${i}" ${completed.has(i)?'disabled':''}>${completed.has(i)?'✓':i+1}</button>`).join('')}</div><div id="questionarea" style="margin-top:25px"></div><p id="feedback" class="medium"></p>`;stage.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(+b.dataset.q))}function ask(i){active=i;let q=details[i];$('#questionarea').innerHTML=`<div class="card"><p class="big">${q[0]}</p>${buttons(q[1])}<button class="btn" id="hear" style="margin-top:15px">🔊 Hear Question</button></div>`;speak(q[0]);$('#hear').onclick=()=>speak(q[0]);$('#questionarea').querySelectorAll('[data-i]').forEach(b=>b.onclick=e=>{let j=+b.dataset.i;if(j===q[2]){correct(e,q[1][j][1]);completed.add(i);if(completed.size===details.length){finish(e);setTimeout(()=>{render();$('#feedback').textContent='🎉 All key details found! Retell the story: First, Next, Then, Finally.'},900)}else setTimeout(render,900)}else wrong(e)})}render()}
const yn=[['Lion can climb a tree.',true,'Lion shows his climbing talent.'],['Parrot dances in the story.',false,'Parrot tells jokes. Monkey dances.'],['Elephant feels worried at first.',true,'She does not know her special talent yet.'],['Elephant sprays sand on her friends.',false,'Elephant sprays water.'],['Elephant’s friends thank her.',true,'They appreciate her special talent.'],['Everyone must have the same talent.',false,'Different talents are valuable!']];function yesno(){let index=0;function render(){let q=yn[index];stage.innerHTML=`<h2>Yes or No? 👍👎</h2><p class="medium">${index+1} of ${yn.length}</p><div class="card" style="max-width:800px;margin:20px auto"><div class="emoji">${['🦁🌳','🦜💃','🐘😟','🐘💦','👏🐘','🌟🐾'][index]}</div><p class="big">${q[0]}</p></div><div class="row"><button class="btn" id="yes" style="background:var(--green)">👍 Yes</button><button class="btn" id="no" style="background:var(--pink)">👎 No</button><button class="btn" id="hear">🔊 Listen</button></div><p class="big" id="feedback"></p>`;$('#hear').onclick=()=>speak(q[0]);for(let [id,v] of [['yes',true],['no',false]])$('#'+id).onclick=e=>{if(v===q[1]){correct(e,q[2]);index++;if(index===yn.length){stage.innerHTML=`<h2>🎉 Wonderful Readers!</h2><div class="emoji">🐘🦁🦜🐒⭐</div><p class="big">Everyone has different talents!</p><p class="medium">Tell a partner: “I am good at ______.”</p><button class="btn" id="celebrate">🏆 Finish Lesson</button><p id="feedback"></p>`;$('#celebrate').onclick=e=>{finish(e);speak('Great job! Everyone has different talents!')}}else setTimeout(render,1200)}else wrong(e)};speak(q[0])}render()}
const stages=[['🎨','Talent Warm-up','4 min','Students choose and act out talents; say “I can ...”.',warmup],['🪄','Vocabulary Wizard','7 min','Listen, repeat and mime eight lesson words.',wizard],['🔎','Animal Detective','6 min','Identify four animals and match their talents.',detective],['📖','Story Details','8 min','After reading Progress 1 pp. 18–21, choose numbered comprehension questions. Invite oral retelling.',story],['👍','Yes or No','5 min','Check story understanding, then students share their own talents.',yesno]];function drawNav(){$('#dots').innerHTML=stages.map((s,i)=>`<button class="dot ${i===current?'active':''} ${finished.has(i)?'done':''}" data-nav="${i}" title="${s[1]}">${finished.has(i)?'✓':s[0]}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(+b.dataset.nav))}function go(n){current=Math.max(0,Math.min(stages.length-1,n));audio&&audio.cancel();stages[current][4]();$('#teacherTip').innerHTML=`<strong>${stages[current][1]} (${stages[current][2]})</strong><p>${stages[current][3]}</p>`;drawNav()}$('#back').onclick=()=>go(current-1);$('#next').onclick=()=>go(current+1);['teamA','teamB'].forEach((id,i)=>$('#'+id).onclick=()=>{$('#'+id+' span').textContent=++teams[i]});$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'🔇':'🔊';audio&&audio.cancel()};$('#teacher').onclick=()=>$('#panel').hidden=!$('#panel').hidden;$('#pick').onclick=()=>{let max=Math.max(2,Math.min(60,+$('#count').value||20));$('#picked').textContent=String(1+Math.floor(Math.random()*max));speak('Student '+$('#picked').textContent)};$('#reset').onclick=()=>{teams=[0,0];stars=0;$('#stars').textContent=0;$('#teamA span').textContent=0;$('#teamB span').textContent=0};$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();go(0);
</script></body></html>
